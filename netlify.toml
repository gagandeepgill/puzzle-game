# Netlify publishes dist/ as the site root.
#
# dist/ does not exist in a fresh checkout — it is the build output, and it is
# where the hand-authored half of the site (public/) and Payload (app/, built
# from src/) are assembled into one tree. This file used to say "there is
# nothing to build", which stopped being true when the port landed. Without the
# build step Netlify would have nothing to publish at all.
[build]
  publish = "dist"
  # Tests gate the deploy, matching the Pages workflow. Publishing a build
  # that fails its own suite is worse than not publishing.
  command = "npm test && npm run build"

# The service worker must never be served stale, or players get pinned to an
# old app shell until they clear site data.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The React entry point is not content-addressed and names the hashed bundles,
# so caching it would pin players to a stale pair of asset URLs.
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite fingerprints these, so a changed file is a changed URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else is content-addressed by the service worker's cache version,
# so it can be cached hard.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
