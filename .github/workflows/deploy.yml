name: Deploy arcade to GitHub Pages

# demo/ is published as-is, except demo/app/, which is the React build and is
# gitignored — so it has to be built here or the port never ships.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Typecheck and tests gate the deploy. Publishing a build that fails
      # its own suite is worse than not publishing.
      - run: npm test
      - run: npm run build

      - name: Check the service worker lists every page
        run: |
          missing=0
          for f in demo/*.html demo/app/index.html; do
            name=${f#demo/}
            if ! grep -q "'$name'" demo/sw.js; then
              echo "::error file=demo/sw.js::$name is not precached in SHELL — it will not work offline"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
